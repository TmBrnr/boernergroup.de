display_information:
  name: Boerner Publisher
  description: Previews, publishes, updates and deletes newsroom articles with confirmation
  background_color: "#171714"
features:
  bot_user:
    display_name: Boerner Publisher
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read
settings:
  event_subscriptions:
    request_url: https://boernergroup.de/api/webhooks/slack
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
    request_url: https://boernergroup.de/api/webhooks/slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
